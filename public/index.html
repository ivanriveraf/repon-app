<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Viewport optimizado para móvil -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

    <!-- PWA y colores -->
    <meta name="theme-color" content="#b0003a" />
    <meta name="background-color" content="#fff0f5" />

    <!-- App meta -->
    <meta name="description" content="Gestiona el inventario de tu hogar y nunca más te quedes sin nada. Lista del super inteligente con Repón." />
    <meta name="keywords" content="lista super, inventario hogar, compras, supermercado, lista compras" />

    <!-- iOS / Apple Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Repón" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- Open Graph (para compartir) -->
    <meta property="og:title" content="Repón — tu hogar, siempre listo" />
    <meta property="og:description" content="Gestiona el inventario de tu hogar y nunca más te quedes sin nada." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fuente Nunito desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <title>Repón — tu hogar, siempre listo</title>

    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        background: #fff0f5;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
      }
      /* Quitar estilos de selección de texto en móvil para botones */
      button { -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <noscript>Necesitas activar JavaScript para usar Repón.</noscript>
    <div id="root"></div>
  </body>
</html>
